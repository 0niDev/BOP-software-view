name: Keepalive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install SQLite Cloud SDK
        run: npm install @sqlitecloud/drivers

      - name: Ping SQLite Cloud
        env:
          SQLITECLOUD_URL: ${{ secrets.SQLITECLOUD_URL }}
        run: |
          node -e "
            const { Database } = require('@sqlitecloud/drivers');
            const db = new Database(process.env.SQLITECLOUD_URL);
            db.sql('SELECT 1;')
              .then(() => {
                console.log('Successfully pinged SQLite Cloud!');
                process.exit(0);
              })
              .catch(err => {
                console.error('Ping failed:', err);
                process.exit(1);
              });
          "
