name: Keepalive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SQLite Cloud to prevent auto-suspend
        env:
          SQLITECLOUD_API_KEY: ${{ secrets.SQLITECLOUD_API_KEY }}
          SQLITECLOUD_URL: ${{ secrets.SQLITECLOUD_URL }}
          SQLITECLOUD_DATABASE: ${{ secrets.SQLITECLOUD_DATABASE }}
        run: |
          curl -s -X POST "$SQLITECLOUD_URL" \
            -H "Authorization: Bearer $SQLITECLOUD_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"sql\":\"SELECT 1\",\"database\":\"$SQLITECLOUD_DATABASE\"}"
