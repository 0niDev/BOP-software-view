name: Keepalive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SQLite Cloud to prevent auto-suspend
        run: |
          curl -s -X POST "https://cjja8z6pvz.g4.sqlite.cloud/v2/weblite/sql" \
            -H "Authorization: Bearer bmJZ0l1RTFCoxS0Au17c0iofzZmrDn2Db94v0YtV9Uw" \
            -H "Content-Type: application/json" \
            -d '{"sql":"SELECT 1","database":"MainDatabase.sqlite"}'
