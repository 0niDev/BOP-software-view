name: Keepalive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping SQLite Cloud
        env:
          SQLITECLOUD_API_KEY: ${{ secrets.SQLITECLOUD_API_KEY }}
          SQLITECLOUD_URL: ${{ secrets.SQLITECLOUD_URL }}
          SQLITECLOUD_DATABASE: ${{ secrets.SQLITECLOUD_DATABASE }}
        run: |
          if [ -z "$SQLITECLOUD_URL" ] || [ -z "$SQLITECLOUD_API_KEY" ]; then
            echo "::error::Secrets are missing!"
            exit 1
          fi

          curl -g -i -X POST "$SQLITECLOUD_URL" \
            -H "Authorization: Bearer $SQLITECLOUD_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"sql\":\"SELECT 1\",\"database\":\"$SQLITECLOUD_DATABASE\"}"
